<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>BlockBuster | Admin - Login </title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="all,follow">
    <!-- Bootstrap CSS-->
    <link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="assets/fonts/font-awesome/css/font-awesome.min.css">
    <!-- Custom Font Icons CSS-->
    <link rel="stylesheet" href="assets/css/admin/font.css">
    <!-- Google fonts - Muli-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Muli:300,400,700">
    <!-- theme stylesheet-->
    <link rel="stylesheet" href="assets/css/admin/style.default.css" id="theme-stylesheet">
    <!-- Custom stylesheet - for your changes-->
    <link rel="stylesheet" href="assets/css/admin/login.css">
    <link rel="stylesheet" href="assets/css/notification.css"/>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/images/B.png">
  </head>
  <body>
    <div class="login-page">
        <div class="container d-flex align-items-center justify-content-center min-vh-100">
          <div class="form-holder has-shadow">
            <div class="row no-gutters">
              <!-- Logo & Information Panel -->
              <div class="col-lg-6 d-flex align-items-center info-panel">
                <div class="content text-white p-4">
                  <div class="logo mb-3">
                    <h1>BlockBuster Admin</h1>
                  </div>
                   <p><strong>Manage your ticket system, movies, and customers here.</strong></p>
                </div>
              </div>

              <!-- Form Panel -->
              <div class="col-lg-6 bg-white">
                <div class="form d-flex align-items-center py-5 px-4">
                  <div class="content w-100">
                    <form method="post" class="form-validate" onsubmit="return false;">
                      <div class="form-group">
                        <input id="login-username" type="text" name="loginUsername" required class="input-material" />
                        <label for="login-username" class="label-material">User Name</label>
                      </div>
                      <div class="form-group">
                        <input id="login-password" type="password" name="loginPassword" required class="input-material" />
                        <label for="login-password" class="label-material">Password</label>
                      </div>
                      <button type="submit" class="btn btn-primary w-100 mt-3" onclick="adminSignIn(event);">Login</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    <!-- JavaScript files-->
    <script src="assets/js/vendor/jquery.min.js"></script>
    <script src="assets/js/vendor/bootstrap.min.js"></script>
    <script src="assets/js/vendor/jquery.cookie.js"> </script>
    <script src="assets/js/vendor/Chart.min.js"></script>
    <script src="assets/js/admin/front.js"></script>
    <script src="assets/js/admin/admin-sign-in.js"></script>
    
     <script src="assets/js/notification.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  </body>
</html>
