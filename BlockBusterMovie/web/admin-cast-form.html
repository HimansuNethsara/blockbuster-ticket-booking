<!DOCTYPE html>
<html>
  <head> 
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>BlockBuster | Admin Cast Form </title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="all,follow">
    <!-- Bootstrap CSS-->
    <link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="assets/fonts/font-awesome/css/font-awesome.min.css">
    <!-- Custom Font Icons CSS-->
    <link rel="stylesheet" href="assets/css/admin/font.css">
    <!-- Google fonts - Muli-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Muli:300,400,700">
    <!-- theme stylesheet-->
    <link rel="stylesheet" href="assets/css/admin/style.default.css" id="theme-stylesheet">
    <!-- Custom stylesheet - for your changes-->
    <link rel="stylesheet" href="assets/css/notification.css"/>
    <link rel="stylesheet" href="assets/css/multi-select.css"/>
<!--    <link rel="stylesheet" href="assets/css/admin/login.css">-->
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/images/B.png">
    
    <style>
        
        .custom-dark-file {
            background-color: #2b2b2b;
            color: #ccc;
            border: 1px solid #444;
            padding: 0.45rem 0.75rem;
            font-size: 0.9rem;
            border-radius: 4px;
          }

          .custom-dark-file::file-selector-button {
            background-color: #444;
            color: #ccc;
            border: none;
            padding: 0.4rem 0.75rem;
            margin-right: 1rem;
            border-radius: 4px;
            cursor: pointer;
          }

          .custom-dark-file::file-selector-button:hover {
            background-color: #555;
          }
        
    </style>
        
  </head>
  <body>
    <header class="header" id="page-header"></header>
    
<div class="d-flex align-items-stretch">
      <!-- Sidebar Navigation-->
      <nav id="sidebar"></nav>
      <!-- Sidebar Navigation end-->
      <div class="page-content">
        <!-- Page Header-->
        <div class="page-header no-margin-bottom">
          <div class="container-fluid">
            <h2 class="h5 no-margin-bottom">Admin Cast Form</h2>
          </div>
        </div>
        <!-- Breadcrumb-->
        <div class="container-fluid">
          <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active">Add Actors & Directors </li>
          </ul>
        </div>
        <section class="no-padding-top">
          <div class="container-fluid">
            <div class="row">
                
                <div class="col-lg-6">
                    <div class="block">
                      <div class="title"><strong class="d-block">Add Actors</strong><span class="d-block">Fill in the actor’s name and upload a profile image.</span></div>
                      <div class="block-body">
                        <form>
                          <div class="form-group">
                            <label class="form-control-label">Actor Name</label>
                            <input type="text" id="actor-name" placeholder="Actor Name" class="form-control" required>
                          </div>
                          <div class="form-group">       
                            <label class="form-control-label">Profile Image</label>
                            <input type="file" id="img1" class="form-control custom-dark-file" accept="image/*" required>
                          </div>
                          <div class="form-group">       
                              <button type="button" class="btn btn-primary" onclick="addActor();">Add Actor</button>
                          </div>
                        </form>
                      </div>
                    </div>
                </div>
                
                <div class="col-lg-6">
                    <div class="block">
                      <div class="title"><strong class="d-block">Add Directors</strong><span class="d-block">Fill in the director’s name and upload a profile image.</span></div>
                      <div class="block-body">
                        <form>
                          <div class="form-group">
                            <label class="form-control-label">Director Name</label>
                            <input type="text" id="director-name" placeholder="Director Name" class="form-control">
                          </div>
                          <div class="form-group">       
                            <label class="form-control-label">Profile Image</label>
                            <input type="file" id="img2" class="form-control custom-dark-file" accept="image/*">
                          </div>
                          <div class="form-group">       
                            <button type="button" class="btn btn-primary" onclick="addDirector()">Add Director</button>
                          </div>
                        </form>
                      </div>
                    </div>
                </div>
                
            </div>
          </div>
        </section>
        <footer class="footer"></footer>
      </div>
    </div>
    <!-- JavaScript files-->
    <script src="assets/js/vendor/jquery.min.js"></script>
    <script src="assets/js/vendor/bootstrap.min.js"></script>
    <script src="assets/js/vendor/jquery.cookie.js"> </script>
    <script src="assets/js/vendor/Chart.min.js"></script>
    <script src="assets/js/admin/front.js"></script>     
    <script src="assets/js/admin/charts-home.js"></script>

    <script src="assets/js/admin/admin-content-loader.js"></script>
    <script src="assets/js/notification.js"></script>
    <script src="assets/js/admin/admin-cast-form.js"></script>
    <script src="assets/js/admin/admin-sign-out.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js"></script>
  </body>
</html>
