<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | BlockBuster</title>
    <link rel="icon" type="image/x-icon" href="assets/images/B.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/forgot-password.css">
    <link rel="stylesheet" href="assets/css/notification.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="assets/images/logo2.png" alt="BlockBuster Logo">
        </div>

        <h1>Forgot Your Password?</h1>
        <p class="subtitle">Enter your registered email address and we'll send your password.</p>

        <p id="message-box" style="display: none;">
            <i id="message-icon" class="fas" style="margin-right: 6px;"></i>
            <span id="message-text"></span>
        </p><br/>

        <form onsubmit="return false;">
            <div class="form-group">
                <label for="email">Registered Email Address</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>

            <button type="button" onclick="sendPassword();" class="primary-btn">Send Password</button>
            <button type="button" onclick="window.location.href='sign-in.html'" class="secondary-btn">Back to Login</button>
        </form>
    </div>

    <script src="assets/js/notification.js"></script>
    <script src="assets/js/forgot-password.js"></script>
</body>
</html>
